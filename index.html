/* Category navigation and selectable aromas have distinct shapes and surfaces. */
.aroma-selected{padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.aroma-selected-label{font-size:12px;color:var(--muted);font-weight:600}
.aroma-selected .chips{margin-bottom:0}
.aroma-heading{display:flex;align-items:center;gap:8px;font-size:14px;margin:0}
.aroma-heading>span{display:inline-grid;place-items:center;width:23px;height:23px;border:1px solid var(--line);border-radius:50%;font:12px Georgia,serif;color:var(--muted);flex-shrink:0}
.aroma-category-list{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.aroma-category{border-radius:5px;background:transparent;border-color:transparent;color:var(--muted);font-size:13px;padding:8px 12px}
.aroma-category.active{background:var(--soft);border-color:transparent;box-shadow:inset 0 -3px var(--accent);font-weight:600}
.aroma-options{padding:18px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.aroma-options .chips{margin:16px 0 0}
.aroma-options .chip{background:var(--paper)}
.aroma-options .chip.selected{background:var(--accent)}
.toolbar>button{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;line-height:1.5}

.aroma-tone{--aroma-h:180;--tone-bg:hsl(var(--aroma-h) 48% 93%);--tone-ink:hsl(var(--aroma-h) 56% 28%);--tone-edge:hsl(var(--aroma-h) 35% 70%)}

.aroma-category.aroma-tone,.aroma-options .chip.aroma-tone,.tag.aroma-tone,.chip.selected.aroma-tone{background:var(--tone-bg);color:var(--tone-ink);border:1px solid var(--tone-edge)}
.aroma-category.aroma-tone.active{box-shadow:inset 0 -3px var(--tone-ink);border-color:var(--tone-ink)}
.aroma-options .chip.aroma-tone.selected{box-shadow:inset 0 0 0 1px var(--tone-ink);border-color:var(--tone-ink);font-weight:600}
.tag.aroma-tone{border-left:3px solid var(--tone-ink)}
.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}

.head h1:last-child{margin-bottom:0}.head>.actions{align-items:center}@media(max-width:650px){.head>.actions>button{flex:1}.head>.actions{gap:8px}}

<script>
'use strict';
const KEY='wine-tasting-lab-v1', VERSION=1, $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), now=()=>new Date().toISOString(), today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, types=['赤','白','ロゼ','オレンジ','スパークリング','その他'];
const metrics={acidity:'酸味',sweetness:'甘味',tannin:'タンニン',body:'ボディ',alcoholFeel:'アルコールの印象',flavor:'風味の強さ',finish:'余韻',preference:'自分の好み',colorDepth:'色の濃淡',aromaIntensity:'香りの強さ',confidence:'自信度'};
const aromas={'柑橘系':['レモン','ライム','グレープフルーツ','オレンジ'],'青系果実':['青リンゴ','洋梨'],'白系果実':['白桃','アプリコット'],'赤系果実':['イチゴ','ラズベリー','チェリー'],'黒系果実':['カシス','ブラックベリー','ブルーベリー','プラム'],'トロピカル':['パイナップル','マンゴー','パッションフルーツ'],'花':['白い花','バラ','スミレ'],'ハーブ・植物':['青草','ミント','ピーマン'],'スパイス':['黒コショウ','シナモン','クローヴ'],'樽・焙煎':['バニラ','トースト','コーヒー'],'発酵由来':['バター','パン','ヨーグルト'],'熟成香':['ドライフルーツ','革','きのこ','はちみつ'],'その他':['石','土']};
const familyHues={'柑橘系':47,'青系果実':95,'白系果実':25,'赤系果実':355,'黒系果実':265,'トロピカル':65,'花':315,'ハーブ・植物':155,'スパイス':15,'樽・焙煎':35,'発酵由来':195,'熟成香':225,'その他':180};
function aromaFamily(aroma){return Object.keys(aromas).find(k=>aromas[k].includes(aroma));}
function aromaTone(aroma,family=false){const f=family?aroma:aromaFamily(aroma);return f?`style="--aroma-h:${familyHues[f]}" title="${esc(f)}"`: 'style="--tone-bg:var(--bg);--tone-ink:var(--muted);--tone-edge:var(--line)" title="自由入力・系統未分類"';}
const help={'酸味':'口の中に感じる酸っぱさ。強さを記録します。品質の良し悪しとは別です。','タンニン':'歯ぐきや舌に感じる渋み・収れん感。苦味とは分けて観察します。','ボディ':'口の中で感じるワインの重さや厚み。軽い〜重いで記録します。','余韻':'飲み込んだ後、または吐き出した後に風味が続く長さ。','マロラクティック発酵':'リンゴ酸が乳酸に変わる過程。バターのような香りを感じる場合もあります。','樽香':'バニラやトーストなど、樽の使用と関係することがある香り。香りだけで製法は断定できません。','熟成香':'時間の経過とともに現れる、ドライフルーツや革などの香り。','第1・第2・第3アロマ':'第1はブドウに由来する香り、第2は発酵・醸造に関係する香り、第3は熟成に関係する香りを整理する目安です。','品質評価':'好みとは分け、バランス・余韻・風味の明瞭さ・複雑さなどを自分の言葉で考察します。公式WSET評価や資格判定ではありません。'};
let db, storageBlocked=false, page='home', current=null, category='柑橘系', compareIds=[], filters={q:'',grape:'',region:'',type:'',session:'',sort:'date',favorite:false}, pendingImport=null;
function seed(){const s={id:uid(),name:'品種の個性を探る',date:today(),place:'デモ・テイスティングルーム',theme:'酸味とボディ、香りのワイン比較',memo:'架空のサンプルです。自由に編集・削除できます。',demo:true,createdAt:now(),updatedAt:now()};const wines=[['丘のシャルドネ','白','シャルドネ','フランス','ブルゴーニュ',4,1,null,3,4,4,['レモン','白桃','バター']],['森のピノ・ノワール','赤','ピノ・ノワール','フランス','ブルゴーニュ',4,1,2,2,3,4,['チェリー','ラズベリー','きのこ']],['陽だまりのカベルネ','赤','カベルネ・ソーヴィニヨン','チリ','セントラル・ヴァレー',3,1,4,5,5,3,['カシス','ブラックベリー','バニラ']]].map((a,i)=>({...newWine(s.id),name:a[0],type:a[1],grapes:a[2],country:a[3],region:a[4],acidity:a[5],sweetness:a[6],tannin:a[7]??'na',body:a[8],flavor:a[9],preference:a[10],finish:4,aromas:a[11],status:'complete',demo:true,vintage:'2022',note:['果実とやわらかな口当たり。','軽やかなボディと赤い果実。','凝縮した果実としっかりした渋み。'][i]}));return {schemaVersion:VERSION,sessions:[s],wines,settings:{theme:'light'},lastWineId:null};}
function newWine(sessionId,blind=false){return {id:uid(),sessionId,createdAt:now(),updatedAt:now(),status:'draft',name:'',type:'赤',aromas:[],aromaOrigins:{},favorite:false,blind,revealed:false,mode:'quick',prediction:{},predictionSnapshot:null};}
function validData(x){if(!x||x.schemaVersion!==VERSION||!Array.isArray(x.sessions)||!Array.isArray(x.wines)||x.sessions.length>10000||x.wines.length>20000)throw Error('対応するスキーマ（v1）のバックアップではありません。');if(x.settings!=null&&(typeof x.settings!=='object'||Array.isArray(x.settings)||!['light','dark',undefined].includes(x.settings.theme)))throw Error('設定の形式が不正です。');const ids=new Set();for(const s of x.sessions){if(!s||typeof s.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(s.id)||ids.has(s.id))throw Error('セッションIDが不正です。');ids.add(s.id);checkObject(s);for(const k of ['name','date','place','theme','memo','createdAt','updatedAt'])if(s[k]!=null&&typeof s[k]!=='string')throw Error('セッションの形式が不正です。');}const ws=new Set();for(const w of x.wines){if(!w||typeof w.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(w.id)||ws.has(w.id)||!ids.has(w.sessionId)||!['draft','complete'].includes(w.status)||!types.includes(w.type)||!Array.isArray(w.aromas)||w.aromas.some(a=>typeof a!=='string'))throw Error('ノートの形式または参照先が不正です。');ws.add(w.id);checkObject(w);if(typeof w.createdAt!=='string'||typeof w.updatedAt!=='string'||!Number.isFinite(Date.parse(w.createdAt))||!Number.isFinite(Date.parse(w.updatedAt)))throw Error('記録日時が不正です。');for(const [k,v] of Object.entries(w)){if(v!==null&&typeof v==='object'&&!['aromas','aromaOrigins','prediction','predictionSnapshot'].includes(k))throw Error('予期しないデータ構造です。');}for(const k of ['aromaOrigins','prediction','predictionSnapshot'])if(w[k]!=null){if(typeof w[k]!=='object'||Array.isArray(w[k])||Object.values(w[k]).some(v=>typeof v!=='string'))throw Error('香り・予想の形式が不正です。');}for(const k in metrics){if(w[k]!=null&&!(k==='tannin'&&w[k]==='na')&&(!Number.isInteger(w[k])||w[k]<1||w[k]>5))throw Error('評価値は1〜5で指定してください。');}if(w.prediction!=null&&(typeof w.prediction!=='object'||Array.isArray(w.prediction)))throw Error('予想の形式が不正です。');for(const k of ['blind','revealed','favorite','demo'])if(w[k]!=null&&typeof w[k]!=='boolean')throw Error('状態の形式が不正です。');for(const k of ['name','grapes','country','region','producer','vintage','note','comment','updatedAt','createdAt'])if(w[k]!=null&&typeof w[k]!=='string')throw Error('文字列の形式が不正です。');}return x;}
function checkObject(o,depth=0){if(depth>8)throw Error('データが複雑すぎます。');for(const [k,v] of Object.entries(o)){if(['__proto__','constructor','prototype'].includes(k))throw Error('許可されないキーです。');if(typeof v==='string'&&v.length>30000)throw Error('文字列が長すぎます。');if(v&&typeof v==='object')checkObject(v,depth+1);}}
try{const raw=localStorage.getItem(KEY);db=raw?validData(JSON.parse(raw)):seed();if(!raw)localStorage.setItem(KEY,JSON.stringify(db));}catch(e){db={schemaVersion:1,sessions:[],wines:[],settings:{theme:'light'}};storageBlocked=true;setTimeout(()=>toast('保存データを読み込めません。設定から元データを退避できます。'),100);}
function persist(){if(storageBlocked){$('#saveStatus').textContent='保存停止中 · 設定を確認';return false;}try{localStorage.setItem(KEY,JSON.stringify(db));$('#saveStatus').textContent='保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});return true;}catch(e){$('#saveStatus').textContent='保存失敗 · JSONで退避';toast('ブラウザに保存できません。設定からJSONをダウンロードしてください。');return false;}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4500);}
const hidden=w=>w.blind&&!w.revealed, title=w=>hidden(w)?'ブラインド '+(db.wines.filter(x=>x.sessionId===w.sessionId).findIndex(x=>x.id===w.id)+1):(w.name||'ワイン #'+(db.wines.filter(x=>x.sessionId===w.sessionId).findIndex(x=>x.id===w.id)+1)), val=v=>v==='na'?'対象外':v??'未入力', tags=a=>(a||[]).map(t=>`<span class="tag aroma-tone" ${aromaTone(t)}>${esc(t)}</span>`).join(''), btn=(text,action,extra='',cls='')=>`<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;
function goto(p){page=p;current=null;render();window.scrollTo(0,0);}function edit(id){current=id;page='note';db.lastWineId=id;persist();render();window.scrollTo(0,0);}
function render(){document.body.classList.toggle('dark',db.settings?.theme==='dark');$('#nav').innerHTML=[['home','⌂','ホーム'],['sessions','▤','セッション'],['library','▦','ライブラリ'],['compare','◈','比較'],['settings','⚙','設定']].map(([p,i,n])=>btn(`<span>${i}</span> ${n}`,'nav',`data-page="${p}"`,page===p?'active':'')).join('')+'<div class="navfoot">WINE TASTING LAB<br>PERSONAL NOTEBOOK<br>VERSION 0.1 BETA</div>';$('#app').innerHTML=page==='home'?home():page==='sessions'?sessions():page==='note'?note():page==='library'?library():page==='compare'?compare():settings();if(storageBlocked)$('#saveStatus').textContent='保存停止中 · 設定を確認';}
function card(w){return `<article class="card wine" style="--wine:${w.type==='白'?'#b69b55':w.type==='ロゼ'?'#ce8e8f':'#884659'}"><div class="row"><span class="eyebrow">${esc(w.type)} / ${esc((w.createdAt||'').slice(0,10))}</span><span>${w.demo?'<span class="badge">デモ</span>':''} ${w.status==='draft'?'<span class="badge">下書き</span>':''}</span></div><h3 style="margin-top:16px">${esc(title(w))}</h3><p class="muted">${hidden(w)?'答え合わせまで情報を非表示':esc([w.grapes,w.country,w.region].filter(Boolean).join(' · ')||'基本情報は未入力')}</p><div>${tags(w.aromas?.slice(0,4))}</div><div class="row" style="margin-top:13px"><span class="score" aria-label="好み ${val(w.preference)}">${w.preference?'★'.repeat(w.preference)+'☆'.repeat(5-w.preference):'—'}</span>${btn(w.favorite?'★ お気に入り':'☆','favorite',`data-id="${w.id}" aria-label="お気に入り切替"`)}</div><div class="actions">${btn('ノートを開く','edit',`data-id="${w.id}"`)}${btn('比較に追加','selectCompare',`data-id="${w.id}"`)}${btn('複製','duplicate',`data-id="${w.id}"`)}${btn('削除','deleteWine',`data-id="${w.id}"`,'danger')}</div></article>`;}
function heading(k,t,d,actions=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1>${d?`<div class="muted">${d}</div>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;}
function home(){const real=db.wines.filter(w=>!w.demo&&w.status==='complete'), rated=real.filter(w=>w.preference), grapes=new Set(real.filter(w=>!hidden(w)).flatMap(w=>(w.grapes||'').split(/[,、]/).map(x=>x.trim()).filter(Boolean))), last=db.wines.find(w=>w.id===db.lastWineId);return heading('DASHBOARD','ダッシュボード','',btn('＋ 新しいセッション','newSession','','primary')+(last?btn('前回のノートを再開','edit',`data-id="${last.id}"`):''))+`<div class="stats"><div class="stat"><span>テイスティング</span><strong>${real.length}<small style="font:12px sans-serif"> 本</small></strong></div><div class="stat"><span>記録した品種</span><strong>${grapes.size}<small style="font:12px sans-serif"> 種</small></strong></div><div class="stat"><span>平均の好み · ${rated.length}件</span><strong>${rated.length?(rated.reduce((s,w)=>s+w.preference,0)/rated.length).toFixed(1):'—'}<small style="font:12px sans-serif"> / 5</small></strong></div></div><section class="section"><div class="row"><h2>最近のテイスティング</h2>${btn('すべて見る →','nav','data-page="library"','linkbutton')}</div><div class="grid">${db.wines.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,3).map(card).join('')||'<div class="empty">記録はありません。「新しいセッション」から追加できます。</div>'}</div></section><section class="section"><h2>最近のセッション</h2>${sessionCards(3)}</section><section class="section"><h2>高評価のワイン</h2><div class="grid">${real.filter(w=>w.preference>=4).sort((a,b)=>b.preference-a.preference).slice(0,3).map(card).join('')||'<p class="muted">好みが4以上の実記録がここに並びます。</p>'}</div></section><section class="section"><h2>好みの傾向</h2>${trends(real)}</section><div class="footer">デモ・下書きは実記録の集計に含みません。データはこのブラウザに保存されます。</div>`;}
function trends(real){const rated=real.filter(w=>w.preference), group=key=>{const m=Object.create(null);for(const w of rated.filter(w=>!hidden(w))){const k=w[key]?.trim();if(k)(m[k]??=[]).push(w.preference);}return Object.entries(m).sort((a,b)=>b[1].reduce((s,x)=>s+x,0)/b[1].length-a[1].reduce((s,x)=>s+x,0)/a[1].length).slice(0,3).map(([k,a])=>`<div class="row"><span>${esc(k)}</span><span>${(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1)} <small>（${a.length}件${a.length<5?'・参考値':''}）</small></span></div>`).join('')||'<p class="muted">情報のある記録がまだありません。</p>';};const high=rated.filter(w=>w.preference>=4), counts=Object.create(null);high.forEach(w=>new Set(w.aromas).forEach(a=>counts[a]=(counts[a]||0)+1));return `<div class="two"><div class="card"><h3>好み評価が高い品種</h3>${group('grapes')}<small>ブレンドは組み合わせ単位で集計します。</small></div><div class="card"><h3>好み評価が高い地域</h3>${group('region')}</div></div><div class="card section"><h3>高評価ワインの香り</h3>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([a,n])=>`<span class="tag aroma-tone" ${aromaTone(a)}>${esc(a)} ${n}/${high.length}件</span>`).join('')||'<p class="muted">好みが4以上の記録はありません。</p>'}<p class="muted">好み4以上の${high.length}件を集計。${rated.length<5?'まだ記録が少ないため、傾向は参考値です。':''}同じ銘柄の繰り返し記録を含み、香りが好みの原因とは限りません。</p></div>`;}
function sessionCards(limit=999){return `<div class="grid">${db.sessions.slice().reverse().slice(0,limit).map(s=>`<article class="card"><div class="row"><small>${esc(s.date)}</small>${s.demo?'<span class="badge">デモ</span>':''}</div><h3>${esc(s.name)}</h3><p class="muted">${esc(s.place||'場所未登録')} · ${db.wines.filter(w=>w.sessionId===s.id).length}本</p><p>${esc(s.theme||'テーマ未入力')}</p><div class="actions">${btn('＋ 記録','addWine',`data-session="${s.id}"`,'primary')}${btn('ブラインド','addBlind',`data-session="${s.id}"`)}${btn('詳細','sessionEdit',`data-id="${s.id}"`)}${btn('一覧','sessionLibrary',`data-id="${s.id}"`)}${btn('比較','sessionCompare',`data-id="${s.id}"`)}</div></article>`).join('')||'<p class="empty">新しいセッションを作成してください。</p>'}</div>`;}
function sessions(){return heading('SESSIONS','セッション','',btn('＋ セッションを作成','newSession','','primary'))+sessionCards();}
function field(label,key,value='',type='text',options=null){const attrs=`data-field="${key}" id="f-${key.replace('.','-')}"`;return `<div class="field"><label for="f-${key.replace('.','-')}">${label}</label>${options?`<select ${attrs}>${options.map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc((key==='country'?countryLabel(o):o)||'未入力')}</option>`).join('')}</select>`:type==='textarea'?`<textarea ${attrs}>${esc(value)}</textarea>`:`<input ${attrs} type="${type}" value="${esc(value)}" ${['grapes','country','region','producer'].includes(key)?`list="list-${key}"`:''} ${type==='number'?'min="0" step="any"':''}>`}</div>`;}
function rating(w,key){return `<div class="metric"><label>${metrics[key]} <small>${val(w[key])}${key==='preference'?'':' · 3＝中程度'}</small></label><div class="rating" role="group" aria-label="${metrics[key]}">${[1,2,3,4,5].map(n=>btn(n,'rate',`data-key="${key}" data-value="${n}" aria-pressed="${w[key]===n}"`,w[key]===n?'selected':'')).join('')}${key==='tannin'?btn('対象外','rate',`data-key="tannin" data-value="na"`,w.tannin==='na'?'selected':''):''}${btn('クリア','rate',`data-key="${key}" data-value="null"`,'clear')}</div></div>`;}
const countryFlags={'フランス':'🇫🇷','イタリア':'🇮🇹','スペイン':'🇪🇸','ドイツ':'🇩🇪','ポルトガル':'🇵🇹','オーストリア':'🇦🇹','スイス':'🇨🇭','ギリシャ':'🇬🇷','ハンガリー':'🇭🇺','ジョージア':'🇬🇪','アメリカ':'🇺🇸','カナダ':'🇨🇦','チリ':'🇨🇱','アルゼンチン':'🇦🇷','ウルグアイ':'🇺🇾','オーストラリア':'🇦🇺','ニュージーランド':'🇳🇿','南アフリカ':'🇿🇦','日本':'🇯🇵','中国':'🇨🇳'};
function countryLabel(value){return Object.hasOwn(countryFlags,value)?countryFlags[value]+' '+value:value;}
const wineCountries=['フランス','イタリア','スペイン','ドイツ','ポルトガル','オーストリア','スイス','ギリシャ','ハンガリー','ジョージア','アメリカ','カナダ','チリ','アルゼンチン','ウルグアイ','オーストラリア','ニュージーランド','南アフリカ','日本','中国','その他','不明'];
function basicOptions(key,value){const base=key==='country'?wineCountries:['NV（ノンヴィンテージ）',...Array.from({length:new Date().getFullYear()-1900+1},(_,i)=>String(new Date().getFullYear()-i)),'不明'];return ['',...new Set([...base,...db.wines.filter(w=>!hidden(w)).map(w=>w[key]).filter(Boolean),...(value?[value]:[])])];}
function basic(w){return `<div class="fields">${[['生産者','producer'],['ヴィンテージ','vintage'],['国','country'],['地域・アペラシオン','region'],['品種（複数は「、」区切り）','grapes'],['アルコール度数（%）','abv','number'],['参考価格（円）','price','number'],['提供量（ml）','volume','number']].map(([l,k,t])=>field(l,k,w[k],t,['country','vintage'].includes(k)?basicOptions(k,w[k]):null)).join('')}</div>`;}
function note(){const w=db.wines.find(w=>w.id===current);if(!w)return '<p>ノートが見つかりません。</p>';const s=db.sessions.find(s=>s.id===w.sessionId), detailed=w.mode==='detail';return `<div class="editor">${heading('TASTING NOTE',esc(title(w)),`${esc(s?.name||'')} · ${w.status==='draft'?'下書き':'記録完了'}${w.demo?' · デモ':''}`,btn('用語ヘルプ','help')+btn(detailed?'クイックに戻る':'詳細モード','toggleMode'))}${w.blind?blindPanel(w):''}<div class="card"><span class="step">QUICK NOTE</span><h2>ワイン情報</h2><div class="fields">${hidden(w)?'<p class="muted">銘柄・品種・産地は答え合わせ後に入力できます。</p>':field('ワイン名（空欄でも記録できます）','name',w.name)}${field('ワインの種類','type',w.type,'text',types)}</div>${!hidden(w)?`<details ${detailed?'open':''}><summary>基本情報を追加</summary>${basic(w)}</details>`:''}</div><div class="card"><span class="step">01 / AROMA</span><h2>香り</h2><div class="aroma-selected"><div class="aroma-selected-label">選択した香り</div><div class="chips" id="selectedAromas">${w.aromas.map(a=>btn(`${esc(a)} ×`,'aroma',`data-value="${esc(a)}" aria-pressed="true" ${aromaTone(a)}`,'chip selected aroma-tone')).join('')||'<span class="muted">下の候補から、感じた香りを選んでください</span>'}</div></div><section class="aroma-families" aria-labelledby="aroma-family-heading"><h3 id="aroma-family-heading" class="aroma-heading"><span>1</span> 系統を選ぶ</h3><div class="aroma-category-list" role="group" aria-label="香りの系統">${Object.keys(aromas).map(c=>btn(c,'category',`data-value="${c}" aria-pressed="${category===c}" aria-controls="aroma-options" ${aromaTone(c,true)}`,category===c?'aroma-category aroma-tone active':'aroma-category aroma-tone')).join('')}</div></section><section class="aroma-options" id="aroma-options" aria-labelledby="aroma-options-heading"><div class="row"><h3 id="aroma-options-heading" class="aroma-heading"><span>2</span> ${esc(category)}の香り</h3><small>複数選択できます</small></div><div class="chips">${aromas[category].map(a=>btn((w.aromas.includes(a)?'<span aria-hidden="true">✓ </span>':'')+a,'aroma',`data-value="${a}" aria-pressed="${w.aromas.includes(a)}" ${aromaTone(a)}`,'chip aroma-tone '+(w.aromas.includes(a)?'selected':''))).join('')}</div></section><div class="row"><input id="customAroma" aria-label="自由な香りを追加" placeholder="自分の言葉で香りを追加" maxlength="100" style="flex:1;min-width:130px">${btn('追加','customAroma')}</div>${detailed?rating(w,'aromaIntensity')+`<p class="muted">香りの由来は整理の目安です。不明のままでも構いません。</p><div class="fields">${w.aromas.map((a,i)=>field(esc(a),`origin.${i}`,w.aromaOrigins?.[a]||'','text',['','第1アロマ','第2アロマ','第3アロマ','不明'])).join('')}</div>`:''}</div><div class="card"><span class="step">02 / PALATE</span><h2>味わい</h2><p class="muted">1＝弱い・軽い → 5＝強い・重い。品質の点数ではありません。</p>${['acidity','sweetness','body',...(['赤','オレンジ','ロゼ','その他'].includes(w.type)?['tannin']:[])].map(k=>rating(w,k)).join('')}<details ${detailed?'open':''}><summary>余韻・風味などを詳しく評価</summary>${['flavor','finish','alcoholFeel',...(!['赤','オレンジ','ロゼ','その他'].includes(w.type)?['tannin']:[])].map(k=>rating(w,k)).join('')}<div class="fields">${field('口当たり','texture',w.texture,'text',['','なめらか','引き締まった','クリーミー','厚みがある','その他'])}${field('バランスの印象','balance',w.balance)}${field('味わいで感じた香り','palateAromas',w.palateAromas)}${field('味わいメモ','palateNote',w.palateNote,'textarea')}</div></details></div><div class="card"><span class="step">03 / IMPRESSION</span><h2>好み・評価</h2>${rating(w,'preference')}${field('ひとことメモ','note',w.note,'textarea')}<details ${detailed?'open':''}><summary>総合評価を追加</summary><div class="fields">${field('品質評価（好みとは別の考察）','quality',w.quality,'textarea')}${field('最も印象に残った特徴','highlight',w.highlight)}${field('飲み頃の印象','maturity',w.maturity,'text',['','若い','適期','熟成が進んでいる','不明'])}${field('再び飲みたい？','again',w.again,'text',['','はい','いいえ','迷う'])}${field('総合コメント','comment',w.comment,'textarea')}</div><p class="muted">体系的な観察を参考にした個人用ノートです。公式WSET評価・資格判定ではありません。</p></details></div><div class="card"><details ${detailed?'open':''}><summary>外観・製法・熟成情報</summary><span class="step">APPEARANCE</span><div class="fields">${field('色の分類','colorClass',w.colorClass,'text',['','白系','赤系','ロゼ系','オレンジ系','その他'])}${field('色調','hue',w.hue,'text',['',...(['赤'].includes(w.type)?['パープル','ルビー','ガーネット','トーニー']:w.type==='ロゼ'?['ピンク','サーモン','オレンジ']:['レモン','ゴールド','アンバー'])])}${field('澄明度','clarity',w.clarity,'text',['','澄んでいる','やや濁り','濁り'])}${field('外観メモ','appearanceNote',w.appearanceNote)}</div>${rating(w,'colorDepth')}<div class="fields">${field('樽使用（確認できた情報）','oak',w.oak,'text',['','あり','なし','不明'])}${field('マロラクティック発酵','mlf',w.mlf,'text',['','あり','なし','不明'])}${field('その他の製法','method',w.method)}${field('熟成期間・容器','aging',w.aging)}${field('情報の根拠','source',w.source,'text',['','ラベル','講師の説明','生産者資料','自分の推測','その他'])}</div></details></div><div class="toolbar">${btn('一覧へ','sessionLibrary',`data-id="${w.sessionId}"`)}${btn('記録を完了','complete','','primary')}${btn('完了して次へ','next','','primary')}</div>${['grapes','country','region','producer'].map(k=>`<datalist id="list-${k}">${[...new Set(db.wines.filter(x=>!hidden(x)).map(x=>x[k]).filter(Boolean))].map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`).join('')}</div>`;}
function blindPanel(w){const p=w.predictionSnapshot||w.prediction||{};return `<div class="card"><span class="step">BLIND TASTING</span><h2>${w.revealed?'予想と正解':'ブラインド記録'}</h2>${w.revealed?`<div class="notice"><strong>答え合わせ前の予想（確定）</strong>${Object.entries({grape:'品種',region:'国・産地',climate:'気候',vintage:'ヴィンテージ・熟成度',reason:'根拠',confidence:'自信度'}).map(([k,l])=>`<div class="textwrap">${l}：${esc(p[k]||'未入力')}</div>`).join('')}</div><p>正解情報は下の基本情報に入力してください。予想は別に保持されます。</p>`:`<p class="muted">予想は入力途中でも自動保存されます。</p><details><summary>品種・産地を予想する</summary><div class="fields">${field('予想の品種','prediction.grape',p.grape)}${field('予想の国・産地','prediction.region',p.region)}${field('気候','prediction.climate',p.climate,'text',['','冷涼','中庸','温暖'])}${field('ヴィンテージ・熟成度','prediction.vintage',p.vintage)}${field('予想の根拠','prediction.reason',p.reason,'textarea')}${field('自信度','prediction.confidence',p.confidence,'text',['','1','2','3','4','5'])}</div></details>${btn('予想を確定して答え合わせ','reveal','','primary')}`}</div>`;}
function library(){let list=db.wines.filter(w=>{const identity=hidden(w)?'':`${w.name||''} ${w.grapes||''} ${w.country||''} ${w.region||''} ${w.producer||''}`;return (!filters.q||`${identity} ${title(w)} ${(w.aromas||[]).join(' ')} ${w.note||''}`.toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.grape||(!hidden(w)&&(w.grapes||'').includes(filters.grape)))&&(!filters.region||(!hidden(w)&&`${w.country||''} ${w.region||''}`.includes(filters.region)))&&(!filters.type||w.type===filters.type)&&(!filters.session||w.sessionId===filters.session)&&(!filters.favorite||w.favorite);});list.sort(filters.sort==='rating'?(a,b)=>(b.preference||0)-(a.preference||0):(a,b)=>b.createdAt.localeCompare(a.createdAt));const opts=(key,values)=>`<select aria-label="${key}" data-filter="${key}">${values.map(([v,l])=>`<option value="${esc(v)}" ${filters[key]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;return heading('WINE LIBRARY','ワインライブラリ',`${list.length}件の記録`,btn('＋ 新しい記録','quickAdd','','primary'))+`<div class="filter"><input data-filter="q" aria-label="キーワード検索" placeholder="ワイン名・品種・香りで検索" value="${esc(filters.q)}"><input data-filter="grape" aria-label="品種フィルター" placeholder="品種で絞り込み" value="${esc(filters.grape)}"><input data-filter="region" aria-label="国・地域フィルター" placeholder="国・地域で絞り込み" value="${esc(filters.region)}">${opts('type',[['','すべての種類'],...types.map(x=>[x,x])])}${opts('session',[['','すべてのセッション'],...db.sessions.map(s=>[s.id,s.name])])}${opts('sort',[['date','記録日の新しい順'],['rating','好み評価の高い順']])}${btn(filters.favorite?'★ お気に入りのみ':'☆ お気に入りで絞る','filterFavorite','','ghost')}</div><div class="grid">${list.map(card).join('')||'<div class="empty">該当する記録がありません。</div>'}</div>`;}
const axes=['acidity','sweetness','tannin','body','flavor','finish'], colors=['#0072b2','#d55e00','#009e73','#b45a9b'];
function radar(ws){const point=(i,v)=>{let a=Math.PI*2*i/6-Math.PI/2;return [190+Math.cos(a)*v*23,160+Math.sin(a)*v*23]}, pt=a=>a.join(',');return `<svg viewBox="0 0 380 325" role="img" aria-label="1から5の共通スケールによる味わい比較。欠損値は線をつなぎません。">${[1,2,3,4,5].map(v=>`<polygon points="${axes.map((k,i)=>pt(point(i,v))).join(' ')}" fill="none" stroke="var(--line)"/><text x="194" y="${160-v*23}" fill="var(--muted)" font-size="10">${v}</text>`).join('')}${axes.map((k,i)=>{const p=point(i,6);return `<line x1="190" y1="160" x2="${point(i,5)[0]}" y2="${point(i,5)[1]}" stroke="var(--line)"/><text x="${p[0]}" y="${p[1]}" text-anchor="middle" fill="var(--ink)" font-size="12">${metrics[k]}</text>`}).join('')}${ws.map((w,j)=>axes.map((k,i)=>{if(typeof w[k]!=='number')return '';const p=point(i,w[k]),ni=(i+1)%6,n=point(ni,w[axes[ni]]);return `${typeof w[axes[ni]]==='number'?`<line x1="${p[0]}" y1="${p[1]}" x2="${n[0]}" y2="${n[1]}" stroke="${colors[j]}" stroke-width="2" stroke-dasharray="${['none','6 3','2 3','8 3 2 3'][j]}"/>`:''}<text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" fill="${colors[j]}" font-size="14" font-weight="bold">${j+1}</text>`}).join('')).join('')}</svg>`;}
function compare(){compareIds=compareIds.filter(id=>db.wines.some(w=>w.id===id));const ws=compareIds.map(id=>db.wines.find(w=>w.id===id));const common=ws.length?ws[0].aromas.filter(a=>ws.every(w=>w.aromas.includes(a))):[];return heading('COMPARE & LEARN','ワイン比較','2〜4本の記録を比較できます。',btn('ワインを選ぶ','chooseCompare','','primary'))+(ws.length<2?'<div class="card empty">比較するワインを2本以上選択してください。<br>ライブラリからも追加できます。</div>':`<div class="two"><div class="card"><h2>味わい</h2><div class="legend">${ws.map((w,i)=>`<span style="color:${colors[i]}">${i+1}. ${esc(title(w))}</span>`).join('')}</div>${radar(ws)}<small>欠損値は補完せず、線を切って表示。数値が大きいほど高品質という意味ではありません。</small></div><div class="card"><h2>香りの共通点と違い</h2><h3>全ワインに共通</h3>${tags(common)||'<p class="muted">共通する登録済みタグはありません。</p>'}${ws.map((w,i)=>`<h3 style="margin-top:20px">${i+1}. ${esc(title(w))}</h3>${tags(w.aromas.filter(a=>!common.includes(a)))||'<span class="muted">共通タグ以外なし</span>'}`).join('')}<small>未選択の香りは「感じなかった」とは限りません。</small></div></div><div class="card section" style="--count:${ws.length}"><div class="compare-values">${ws.map((w,i)=>`<div>${btn(`${i+1}. ${esc(title(w))}`,'edit',`data-id="${w.id}"`,'linkbutton')}<div class="muted">${hidden(w)?'情報非表示':esc([w.grapes,w.country,w.region].filter(Boolean).join(' / ')||'情報未入力')}</div></div>`).join('')}</div>${[...axes,'preference'].map(k=>`<div class="compare-row"><strong>${metrics[k]}</strong><div class="compare-values">${ws.map((w,i)=>`<div><div class="bar"><i style="width:${typeof w[k]==='number'?w[k]*20:0}%;background:${colors[i]}"></i></div>${val(w[k])}</div>`).join('')}</div>${ws.length===2&&ws.every(w=>typeof w[k]==='number')?`<small>差：${Math.abs(ws[0][k]-ws[1][k])}段階${ws[0][k]===ws[1][k]?'（同じ）':`（${ws[0][k]>ws[1][k]?'1':'2'}の方が高い）`}</small>`:''}</div>`).join('')}<div class="compare-row"><strong>コメント</strong><div class="compare-values">${ws.map(w=>`<div class="textwrap">${esc(w.comment||w.note||'未入力')}</div>`).join('')}</div></div>`);}
function settings(){return heading('SETTINGS & DATA','設定とデータ','')+`<div class="two"><section class="card"><h2>表示</h2>${btn(db.settings?.theme==='dark'?'☀ ライトモードへ':'☾ ダークモードへ','theme')}<h3 style="margin-top:25px">用語ガイド</h3><p class="muted">入力中も、用語ヘルプから確認できます。</p>${btn('用語を読む','help')}</section><section class="card"><h2>バックアップと復元</h2><p>JSONは全データの復元用、CSVは分析用です。</p><div class="actions">${btn('JSONを書き出す','exportJSON','','primary')}${btn('CSVを書き出す','exportCSV')}${btn('JSONを読み込む','importJSON')}</div><div class="notice">記録はこのブラウザ・端末だけに保存されます。ブラウザのデータ消去で失われます。端末間の自動同期はありません。</div></section><section class="card"><h2>デモデータ</h2><p>架空のワイン3件で、比較や入力を試せます。実記録の集計から除外されます。</p>${btn('デモを一括削除','deleteDemo','','danger')}</section><section class="card"><h2>このアプリについて</h2><p>Wine Tasting Lab v0.1 ベータ<br>データスキーマ v1 · 外部通信なし</p><p class="muted">個人の学習を支える記録ツールです。品質の自動採点や公式WSET評価は行いません。</p>${storageBlocked?`<div class="notice">保存を停止しています。元データを退避してからJSONの復元、または初期化してください。</div>${btn('元の保存データを退避','rawBackup')}${btn('空の状態で初期化','resetStorage','','danger')}`:''}</section></div>`;}
function showDialog(html){$('#dialog').innerHTML=html;$('#dialog').showModal();}function sessionForm(id){let s=db.sessions.find(s=>s.id===id);if(!s){s={id:uid(),name:today()+' テイスティング',date:today(),place:'',theme:'',memo:'',createdAt:now(),updatedAt:now()};db.sessions.push(s);persist();}showDialog(`<div class="row"><h2>セッションを編集</h2>${btn('閉じる','closeDialog')}</div><div data-session-form="${s.id}"><div class="fields">${[['セッション名','name'],['日付','date','date'],['場所','place'],['テーマ・目的','theme'],['メモ・比較して気づいたこと','memo','textarea']].map(([l,k,t])=>field(l,k,s[k],t)).join('')}</div><p class="muted">入力は自動保存されます。</p><div class="actions">${btn('＋ 最初のワインを記録','addWine',`data-session="${s.id}"`,'primary')}${btn('ブラインドで記録','addBlind',`data-session="${s.id}"`)}</div></div>`);}
function addWine(sid,blind=false){const w=newWine(sid,blind);const session=db.sessions.find(s=>s.id===sid);if(session?.demo)w.demo=true;db.wines.push(w);$('#dialog').close();edit(w.id);}
function advanceWine(w,button){
  const originId=w.id, startY=window.scrollY;
  const finish=()=>{if(page==='note'&&current===originId)addWine(w.sessionId,w.blind);};
  if(!startY||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){finish();return;}
  button.disabled=true;
  let started;
  function frame(time){
    if(page!=='note'||current!==originId)return;
    started??=time;
    const progress=Math.min((time-started)/400,1);
    window.scrollTo(0,startY*Math.pow(1-progress,3));
    if(progress<1)window.requestAnimationFrame(frame);else finish();
  }
  window.requestAnimationFrame(frame);
}
function download(name,text,type){const blob=new Blob([text],{type}), url=URL.createObjectURL(blob), a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(v){let s=String(v??'');if(/^[\s\uFEFF]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){const cols=[['記録ID','id'],['セッションID','sessionId'],['ワイン名','name'],['種類','type'],['生産者','producer'],['ヴィンテージ','vintage'],['国','country'],['地域','region'],['品種','grapes'],...Object.entries(metrics).map(([k,v])=>[v,k]),['香り','aromas'],['メモ','note'],['総合コメント','comment'],['品質評価','quality'],['製法','method'],['樽使用','oak'],['MLF','mlf'],['熟成情報','aging'],['根拠','source'],['価格','price'],['アルコール度数','abv'],['提供量','volume'],['状態','status'],['デモ','demo'],['作成日時','createdAt'],['更新日時','updatedAt']];const rows=[['セッション名','日付',...cols.map(c=>c[0]),'回答前の予想'].map(csvCell).join(',')];for(const w of db.wines){const s=db.sessions.find(s=>s.id===w.sessionId);rows.push([s?.name,s?.date,...cols.map(([,k])=>hidden(w)&&['name','producer','vintage','country','region','grapes'].includes(k)?'非表示':Array.isArray(w[k])?w[k].join(' / '):w[k]),JSON.stringify(w.predictionSnapshot||w.prediction||{})].map(csvCell).join(','));}download('wine-tasting-'+today()+'.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');}
function chooseCompare(){showDialog(`<div class="row"><h2>比較するワイン（2〜4本）</h2>${btn('閉じる','closeDialog')}</div>${db.wines.map(w=>`<label class="checkrow"><input type="checkbox" data-compare="${w.id}" ${compareIds.includes(w.id)?'checked':''}>${esc(title(w))}${w.demo?' <small>デモ</small>':''}</label>`).join('')}<div class="actions section">${btn('比較する','finishCompare','','primary')}</div>`);}
function touch(w){w.updatedAt=now();persist();}function refreshNote(){const focus=document.activeElement?.dataset;const savedFocus=focus?{...focus}:null;const y=window.scrollY,opens=[...$('#app').querySelectorAll('details')].map(d=>d.open);render();$('#app').querySelectorAll('details').forEach((d,i)=>{if(opens[i]!=null)d.open=opens[i]});if(savedFocus?.action){const target=[...$('#app').querySelectorAll('[data-action]')].find(el=>el.dataset.action===savedFocus.action&&el.dataset.key===savedFocus.key&&el.dataset.value===savedFocus.value);target?.focus({preventScroll:true});}window.scrollTo(0,y);}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){const sf=el.closest('[data-session-form]');const obj=sf?db.sessions.find(s=>s.id===sf.dataset.sessionForm):db.wines.find(w=>w.id===current);if(!obj)return;const k=el.dataset.field;if(k.startsWith('prediction.')){if(!obj.revealed)(obj.prediction??={})[k.split('.')[1]]=el.value;}else if(k.startsWith('origin.')){const aroma=obj.aromas[Number(k.split('.')[1])];if(!['__proto__','constructor','prototype'].includes(aroma))(obj.aromaOrigins??={})[aroma]=el.value;}else obj[k]=el.value;touch(obj);if(k==='type'){obj.hue='';touch(obj);refreshNote();}}if(el.dataset.filter){if(e.isComposing)return;filters[el.dataset.filter]=el.value;const key=el.dataset.filter,pos=el.selectionStart;render();const next=document.querySelector(`[data-filter="${key}"]`);next?.focus();if(pos!=null)next.setSelectionRange(pos,pos);}});
document.addEventListener('compositionend',e=>{if(e.target.dataset.filter)e.target.dispatchEvent(new Event('input',{bubbles:true}));});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.compare){if(el.checked){if(compareIds.length>=4){el.checked=false;toast('比較は4本まで選択できます。');return;}compareIds.push(el.dataset.compare);}else compareIds=compareIds.filter(id=>id!==el.dataset.compare);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,w=db.wines.find(w=>w.id===current);switch(a){case'nav':goto(b.dataset.page);break;case'newSession':sessionForm();break;case'sessionEdit':sessionForm(id);break;case'closeDialog':$('#dialog').close();render();break;case'addWine':case'addBlind':addWine(b.dataset.session,a==='addBlind');break;case'quickAdd':{const s=db.sessions.filter(s=>!s.demo).at(-1);s?addWine(s.id):sessionForm();break;}case'edit':edit(id);break;case'sessionLibrary':filters.session=id;goto('library');break;case'sessionCompare':compareIds=db.wines.filter(w=>w.sessionId===id).slice(0,4).map(w=>w.id);goto('compare');if(compareIds.length<2)toast('比較には2本以上必要です。');break;case'favorite':{const n=db.wines.find(w=>w.id===id);n.favorite=!n.favorite;touch(n);render();break;}case'duplicate':{const original=db.wines.find(w=>w.id===id),copy=JSON.parse(JSON.stringify(original));copy.id=uid();copy.createdAt=copy.updatedAt=now();copy.status='draft';copy.favorite=false;db.wines.push(copy);persist();edit(copy.id);toast('別のテイスティング記録として複製しました。');break;}case'deleteWine':if(confirm('このテイスティング記録を削除しますか？元に戻せません。')){db.wines=db.wines.filter(w=>w.id!==id);persist();render();}break;case'rate':w[b.dataset.key]=b.dataset.value==='null'?null:b.dataset.value==='na'?'na':Number(b.dataset.value);touch(w);refreshNote();break;case'category':category=b.dataset.value;refreshNote();break;case'aroma':{const v=b.dataset.value;w.aromas=w.aromas.includes(v)?w.aromas.filter(a=>a!==v):[...w.aromas,v];touch(w);refreshNote();break;}case'customAroma':{const v=$('#customAroma').value.trim();if(v&&!['__proto__','constructor','prototype'].includes(v)&&!w.aromas.includes(v)){w.aromas.push(v);touch(w);}refreshNote();break;}case'toggleMode':w.mode=w.mode==='detail'?'quick':'detail';touch(w);render();break;case'complete':case'next':w.status='complete';touch(w);if(a==='next')advanceWine(w,b);else{toast('記録を完了しました。');filters.session=w.sessionId;goto('library');}break;case'reveal':if(confirm('現在の予想を確定して答え合わせしますか？回答前の予想はこの時点で固定されます。')){w.predictionSnapshot=JSON.parse(JSON.stringify(w.prediction||{}));w.revealed=true;w.revealedAt=now();w.mode='detail';touch(w);render();}break;case'filterFavorite':filters.favorite=!filters.favorite;render();break;case'selectCompare':if(!compareIds.includes(id)){if(compareIds.length>=4){toast('比較は4本までです。比較画面で選択を変更してください。');break;}compareIds.push(id);}goto('compare');break;case'chooseCompare':chooseCompare();break;case'finishCompare':if(compareIds.length<2){toast('2本以上選択してください。');break;}$('#dialog').close();goto('compare');break;case'theme':db.settings??={};db.settings.theme=db.settings.theme==='dark'?'light':'dark';persist();render();break;case'help':showDialog(`<div class="row"><h2>テイスティング用語</h2>${btn('閉じる','closeDialog')}</div>${Object.entries(help).map(([k,v])=>`<details><summary>${k}</summary><p>${v}</p></details>`).join('')}`);break;case'exportJSON':download('wine-tasting-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');break;case'exportCSV':exportCSV();break;case'importJSON':$('#importFile').click();break;case'deleteDemo':if(confirm('デモのノートとセッションを削除しますか？デモ内で追加した記録も対象です。')){const ids=db.sessions.filter(s=>s.demo).map(s=>s.id);db.wines=db.wines.filter(w=>!w.demo&&!ids.includes(w.sessionId));db.sessions=db.sessions.filter(s=>!s.demo);persist();render();}break;case'rawBackup':try{download('wine-original-data.txt',localStorage.getItem(KEY)||'','text/plain');}catch(e){toast('元データにアクセスできません。');}break;case'resetStorage':if(confirm('保存データを空の状態で初期化しますか？先に退避してください。')){storageBlocked=false;db={schemaVersion:1,sessions:[],wines:[],settings:{theme:'light'}};persist();render();}break;case'importReplace':case'importMerge':applyImport(a==='importMerge');break;}});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15000000)throw Error('ファイルは15MB以下にしてください。');pendingImport=validData(JSON.parse(await f.text()));showDialog(`<h2>バックアップを復元</h2><p>セッション ${pendingImport.sessions.length}件、ノート ${pendingImport.wines.length}件を検証しました。</p><p>置き換えは現在のデータをすべて上書きします。マージは同じIDの既存データを優先します。</p><div class="actions">${btn('マージ（既存を優先）','importMerge','','primary')}${btn('すべて置き換える','importReplace','','danger')}${btn('キャンセル','closeDialog')}</div>`);}catch(err){toast('読み込み失敗：'+err.message);}finally{e.target.value='';}});
function applyImport(merge){if(!pendingImport)return;if(!merge&&!confirm('現在の全データをバックアップの内容に置き換えますか？'))return;let next=JSON.parse(JSON.stringify(pendingImport));if(merge){next=JSON.parse(JSON.stringify(db));for(const k of ['sessions','wines']){const ids=new Set(next[k].map(o=>o.id));next[k].push(...pendingImport[k].filter(o=>!ids.has(o.id)));}}try{validData(next);localStorage.setItem(KEY,JSON.stringify(next));db=next;storageBlocked=false;pendingImport=null;compareIds=[];$('#dialog').close();goto('home');persist();toast('バックアップを復元しました。');}catch(e){toast('復元できませんでした。既存データは維持されています：'+e.message);}}
window.addEventListener('storage',e=>{if(e.key===KEY){storageBlocked=true;$('#saveStatus').textContent='別タブの更新を検知 · 保存停止';toast('別タブでデータが変更されました。必要ならJSONに退避し、このページを再読み込みしてください。');}});
if(window.visualViewport){const adjustKeyboard=()=>document.body.classList.toggle('keyboard-open',window.innerHeight-window.visualViewport.height>150);window.visualViewport.addEventListener('resize',adjustKeyboard);}
render();
if(db.lastWineId&&db.wines.some(w=>w.id===db.lastWineId&&w.status==='draft'))edit(db.lastWineId);
</script></body></html>
